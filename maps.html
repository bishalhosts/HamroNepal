<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Explore Nepal's map with all 77 district boundaries and open any district page for local news links."
    />
    <title>Districts &amp; News | Hamro Nepal</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="province/province-page.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="atlas-page-header">
      <a class="atlas-page-brand" href="index.html"
        >Hamro Nepal <span>Calendar · Atlas · News</span></a>
      <nav aria-label="Main navigation">
        <a href="index.html#map">Home</a>
      </nav>
    </header>
    <main id="main-content" class="map-library map-library-districts">
      <section class="district-map-page" aria-labelledby="district-map-heading">
        <h1 id="district-map-heading">Districts &amp; News</h1>
        <p class="map-library-intro">Click a district to visit its page.</p>
        <object
          class="district-map-object"
          data="nepal-districts.svg"
          type="image/svg+xml"
          aria-label="Interactive map of all 77 districts in Nepal"
        >
          <p>
            The interactive district map is unavailable.
            <a href="nepal-districts.svg">Open the district map</a>.
          </p>
        </object>
      </section>
      <section
        class="map-library-section district-map-search-section"
        aria-labelledby="district-map-search-heading"
      >
        <h2 id="district-map-search-heading">Find a district by name</h2>
        <form id="district-map-search-form">
          <label class="district-map-search" for="district-map-search">
            <input
              id="district-map-search"
              type="search"
              list="district-name-options"
              placeholder="Search districts, e.g. Kathmandu"
              autocomplete="off"
              aria-describedby="district-map-count"
              aria-label="Search by district name"
            />
          </label>
          <datalist id="district-name-options"></datalist>
          <button class="district-map-submit" type="submit">
            Open district
          </button>
        </form>
        <p id="district-map-count" class="district-map-count" aria-live="polite">
          Or search by district name.
        </p>
      </section>
    </main>
    <footer class="site-footer">
      <p>
        District boundaries are simplified for display and are not for surveying
        or legal use.
      </p>
      <p><a href="index.html">← Back to Hamro Nepal</a></p>
    </footer>
    <script src="district-data.js"></script>
    <script src="district-map-library.js"></script>
    <script src="district-map-labels.js"></script>
    <script src="site-shell.js"></script>
  </body>
</html>
